name: release

# Builds the Windows executable people actually download. Runs on a tag so that
# what is published is always something someone chose to publish.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pyserial pyinstaller

      - name: Build
        run: >
          pyinstaller --onefile --name smart-esc-tool
          --paths . smart_esc_tool/__main__.py

      - uses: actions/upload-artifact@v4
        with:
          name: smart-esc-tool-windows
          path: dist/smart-esc-tool.exe

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/smart-esc-tool.exe

# Not at .github/workflows/release.yml yet: the token that created this
# repository has no `workflow` scope, so GitHub refuses a push that adds one.
# Move this file into .github/workflows/ to enable Windows .exe releases.
