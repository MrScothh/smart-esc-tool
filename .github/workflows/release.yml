name: release

# Builds the Windows executable people actually download. Runs on a tag so that
# what is published is always something someone chose to publish.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The interface is PySide6 and qfluentwidgets: an executable built without
      # them starts and then fails on the first window.
      - run: pip install pyserial pyinstaller PySide6 "PySide6-Fluent-Widgets[full]"

      # packaging/build.py rather than a bare pyinstaller call: it carries the
      # icon, the manifest and the exclusion list that keeps the download at
      # 51 MB instead of 336, and it is the same script used on a desk.
      - name: Build
        run: python packaging/build.py

      - uses: actions/upload-artifact@v4
        with:
          name: smart-esc-tool-windows
          path: dist/SmartEscTool.exe

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SmartEscTool.exe
